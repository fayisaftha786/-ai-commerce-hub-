name: AI Commerce Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build and validate Cloudflare Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run build:cloudflare
          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc.example", "utf8"));
          config.d1_databases[0].database_id = "00000000-0000-0000-0000-000000000000";
          config.vars.CLIPREWARD_DEBUG_ERRORS = "true";
          fs.writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2) + "\n");
          NODE
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/clipreward-worker-dry-run

      - name: Smoke-test Cloudflare Worker runtime with local D1 and R2
        run: bash scripts/cloudflare-local-smoke.sh

      - name: Build backend container
        run: docker build --tag ai-commerce-hub:test .

      - name: Smoke-test same-origin backend container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ai-commerce-hub-smoke --publish 127.0.0.1:3000:3000 ai-commerce-hub:test
          cleanup() {
            docker rm --force ai-commerce-hub-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/ai-commerce-health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"staticAppServed":true' /tmp/ai-commerce-health.json
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'AI Commerce Hub'
          curl --fail --silent http://127.0.0.1:3000/api/social/providers | grep -q '"provider":"youtube"'
