name: Scheduled Content Rewards discovery snapshot

on:
  # Bootstrap after code/config changes on main. Snapshot-only commits are
  # excluded so the crawler cannot trigger itself in an endless loop.
  push:
    branches:
      - main
    paths-ignore:
      - "content-rewards-assistant/discovery-snapshot.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  scan-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run public campaign discovery scan
        id: scan
        continue-on-error: true
        run: node scripts/content-rewards-discovery-scan.js

      - name: Commit latest scan snapshot
        id: snapshot
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-rewards-assistant/discovery-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot content is unchanged."
          else
            git commit -m "chore: refresh scheduled campaign discovery snapshot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        id: pages
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Assemble and validate static site
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        run: node scripts/pages-build.js _site

      - name: Upload Pages artifact
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy updated discovery snapshot
        id: deployment
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/deploy-pages@v5

      - name: Warn when source scan fails; retained snapshot is still published
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        run: |
          echo "::warning::The third-party campaign feed is unavailable. Previous campaign rows were retained; the failed scan status is recorded in the published snapshot."
          node - <<'NODE'
          const fs = require("node:fs");
          const snapshot = JSON.parse(fs.readFileSync("content-rewards-assistant/discovery-snapshot.json", "utf8"));
          const scan = snapshot.lastScan || {};
          const lines = [
            "## Content Rewards discovery source warning",
            "",
            "- **Source status:** " + (scan.status || "unknown"),
            "- **Last attempt:** " + (scan.completedAt || scan.at || "not recorded"),
            "- **Feed requests:** " + (scan.feedRequestAttempts || 0),
            "- **Saved campaign leads retained:** " + ((snapshot.campaigns || []).length),
            "- **Public campaign pages saved:** " + ((snapshot.campaignDetails || []).length),
            "- **Error:** " + (scan.error || "No error detail recorded"),
            "",
            "The workflow published the snapshot safely. A green deployment does not mean the upstream source is healthy; check the source status above and in the app."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
