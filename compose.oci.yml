name: ai-commerce-hub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SERVE_STATIC_APP: "true"
      STATIC_SITE_DIR: /tmp/ai-commerce-hub-site
      SOCIAL_TOKEN_STORE_PATH: /data/social-token-vault.json
      DISCOVERY_STORE_PATH: /data/content-rewards-discovery.json
      DISCOVERY_SCHEDULER_ENABLED: "false"
    volumes:
      - hub_data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  hub_data:
  caddy_data:
  caddy_config:
