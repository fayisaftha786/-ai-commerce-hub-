name: Deploy ClipReward backend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "cloudflare/**"
      - "wrangler.jsonc.example"
      - "server.js"
      - "youtube-oauth.js"
      - "meta-social-oauth.js"
      - "scripts/pages-build.js"
      - "content-rewards-assistant/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipreward-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_WORKER_URL: ${{ vars.CF_WORKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Cloudflare account configuration and create Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const required = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "CF_D1_DATABASE_ID", "CF_WORKER_URL"];
          const missing = required.filter((key) => !String(process.env[key] || "").trim());
          if (missing.length) {
            console.error("Cloudflare deployment is enabled but required GitHub secrets/variables are missing: " + missing.join(", "));
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error("CF_ACCOUNT_ID must be a 32-character hexadecimal Cloudflare account ID.");
          }
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.env.CF_D1_DATABASE_ID)) {
            throw new Error("CF_D1_DATABASE_ID must be a D1 database UUID.");
          }
          const workerUrl = new URL(process.env.CF_WORKER_URL);
          if (workerUrl.protocol !== "https:" || workerUrl.username || workerUrl.password ||
              workerUrl.pathname !== "/" || workerUrl.search || workerUrl.hash) {
            throw new Error("CF_WORKER_URL must be an HTTPS origin without a path, query, or credentials.");
          }
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc.example", "utf8"));
          config.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          config.d1_databases[0].database_id = process.env.CF_D1_DATABASE_ID;
          const origin = workerUrl.origin;
          config.vars = {
            ...config.vars,
            SOCIAL_CORS_ORIGINS: origin,
            DISCOVERY_CORS_ORIGINS: origin,
            SOCIAL_RETURN_URL: origin + "/content-rewards-assistant/",
            GOOGLE_REDIRECT_URI: origin + "/api/social/youtube/callback",
            META_REDIRECT_URI: origin + "/api/social/meta/callback",
            META_MEDIA_BASE_URL: origin
          };
          fs.writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2) + "\n", { mode: 0o600 });
          console.log("Validated Cloudflare IDs and generated a private, gitignored Wrangler config.");
          NODE

      - name: Build static assets and apply D1 migrations
        run: |
          npm run build:cloudflare
          npx --yes wrangler@4 d1 migrations apply clipreward-studio --remote --config wrangler.jsonc

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Set encrypted token key and optional OAuth secrets
        shell: bash
        env:
          SOCIAL_TOKEN_ENCRYPTION_KEY: ${{ secrets.SOCIAL_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SOCIAL_TOKEN_ENCRYPTION_KEY:-}" ]; then
            echo "::error::SOCIAL_TOKEN_ENCRYPTION_KEY repository secret is required."
            exit 1
          fi
          printf '%s' "$SOCIAL_TOKEN_ENCRYPTION_KEY" | npx --yes wrangler@4 secret put SOCIAL_TOKEN_ENCRYPTION_KEY --config wrangler.jsonc
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET META_APP_ID META_APP_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config wrangler.jsonc
            fi
          done

      - name: Verify deployed Worker health and app shell
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$CF_WORKER_URL/health" > /tmp/clipreward-health.json
          curl --fail --silent --show-error "$CF_WORKER_URL/content-rewards-assistant/" | grep -qi "ClipReward"
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("/tmp/clipreward-health.json","utf8")); if(data.ok !== true) throw new Error("Worker health response did not report ok=true"); console.log("Cloudflare Worker health check passed.");'
